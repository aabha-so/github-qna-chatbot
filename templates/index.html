<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Repository Q&A Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header>
    <h1>GitHub Repository Q&A Chatbot</h1>
    <p>Ask questions about any public GitHub repository.</p>
  </header>

  <main>
    <section id="load-section">
      <input type="text" id="repo-url" placeholder="https://github.com/owner/repo">
      <button id="load-btn">Load Repository</button>
      <p id="load-status"></p>
    </section>

    <section id="chat-section" class="hidden">
      <div id="repo-label"></div>
      <div id="chat-window"></div>

      <div id="chat-input-row">
        <input type="text" id="question-input" placeholder="Ask a question about this repository...">
        <button id="ask-btn">Send</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
